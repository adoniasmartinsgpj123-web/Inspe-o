<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inspeção">
<meta name="theme-color" content="#166534">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Inspeção Ambiental de Canteiro</title>
<style>
:root{--g:#166534;--g2:#15803d;--gl:#dcfce7;--r:#b91c1c;--rl:#fee2e2;--y:#a16207;--yl:#fef9c3;--b:#e5e7eb;--t:#111827;--m:#6b7280;--bg:#f3f4f6;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:15px}
.gps{font-size:12px;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
.gps.ok{background:#22c55e}.gps.bad{background:#ef4444}
main{padding:12px;max-width:820px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--t)}
textarea{min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:12px 16px;font:600 15px/1 inherit;font-family:inherit;background:var(--g);color:#fff;cursor:pointer}
.btn.sec{background:#e5e7eb;color:var(--t)}.btn.red{background:var(--r)}.btn.sm{padding:8px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--m);font-size:13px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;font:500 11px inherit;font-family:inherit;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--g)}
.sec-h{display:flex;align-items:center;gap:10px;cursor:pointer}
.sec-h .n{width:30px;height:30px;border-radius:8px;background:var(--gl);color:var(--g);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sec-h .tt{flex:1;font-weight:600;font-size:15px}
.prog{font-size:12px;color:var(--m);white-space:nowrap}
.prog.done{color:var(--g);font-weight:600}
.bar{height:4px;background:#e5e7eb;border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2)}
.item{border-top:1px solid var(--b);padding:10px 0}
.item .c{font-size:12px;color:var(--m);font-weight:600}
.item .d{font-size:14.5px;margin:2px 0 8px}
.grp{margin:14px 0 2px;font-size:13px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.02em}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid #d1d5db;background:#fff;border-radius:10px;padding:10px 0;font:700 15px inherit;font-family:inherit;color:#374151}
.seg button.C.on{background:var(--g2);border-color:var(--g2);color:#fff}
.seg button.NC.on{background:var(--r);border-color:var(--r);color:#fff}
.seg button.NA.on{background:#6b7280;border-color:#6b7280;color:#fff}
.ncbox{margin-top:8px;padding:8px;border-radius:10px;background:var(--rl);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.slot{border:1.5px dashed #cbd5e1;border-radius:12px;overflow:hidden;background:#f8fafc;display:flex;flex-direction:column}
.slot .st{font-size:11.5px;font-weight:700;padding:7px 8px 5px;color:#334155;text-transform:uppercase;min-height:34px}
.slot .im{aspect-ratio:4/3;background:#e2e8f0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;gap:8px}
.slot .im button{border:0;border-radius:10px;padding:9px 10px;background:#fff;font-size:20px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.slot.has{border-style:solid;border-color:var(--g2)}
.slot .lg{font-size:12px;padding:6px 8px;color:#475569;min-height:30px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.C{background:var(--gl);color:var(--g)}.pill.NC{background:var(--rl);color:var(--r)}.pill.NA{background:#e5e7eb;color:#374151}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 5px;border-bottom:1px solid var(--b);text-align:left}
th{font-size:12px;color:var(--m)}td.n,th.n{text-align:center;width:44px}
.big{font-size:30px;font-weight:800}
.res{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.modal img{width:100%;border-radius:10px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.list-i{display:flex;gap:10px;align-items:center;border-top:1px solid var(--b);padding:12px 0}
.list-i:first-of-type{border-top:0}
.list-i .x{flex:1;min-width:0}.list-i .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn{background:var(--yl);color:#713f12;border-radius:10px;padding:10px 12px;font-size:13.5px}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px;color:var(--t)}
.chk input{width:22px;height:22px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><button id="hBack" style="display:none">‹ Voltar</button><h1 id="hTitle">Inspeção Ambiental de Canteiro</h1><span id="gps" class="gps">GPS…</span></header>
<main id="app"></main>
<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="dados"><b>📝</b>Dados</button>
  <button data-tab="check"><b>✅</b>Checklist</button>
  <button data-tab="nc"><b>⚠️</b>Não conf.</button>
  <button data-tab="resumo"><b>📊</b>Relatório</button>
</nav>
<input type="file" id="fCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fGal" accept="image/*" style="display:none">

", "row": 63, "group": false}, {"code": "3.3.2", "text": "A baia está sinalizada, organizada, limpa e sem exceder a capacidade total de armazenamento", "row": 64, "group": false}, {"code": "3.3.3", "text": "A baia possui acesso restrito", "row": 65, "group": false}, {"code": "3.3.4", "text": "A baia é pavimentada ou provida de base com material impermeabilizante, coberto e arejado", "row": 66, "group": false}, {"code": "3.3.5", "text": "A baia possui aparatos de contenção e kit de emergência ambiental", "row": 67, "group": false}, {"code": "3.3.6", "text": "O kit de mitigação está completo, com todos os componentes necessários e nas quantidades previstas", "row": 68, "group": false}, {"code": "3.3.7", "text": "A baia possui sistema de drenagem e captação de líquidos contaminados, para eventuais vazamentos", "row": 69, "group": false}, {"code": "3.3.8", "text": "A baia está isenta de acumulo de água e vetores", "row": 70, "group": false}, {"code": "3.3.9", "text": "A baia de resíduos perigosos está separada da baia de produtos perigosos", "row": 71, "group": false}, {"code": "3.3.10", "text": "As pilhas e baterias usadas e inservíveis estão separadas e acondicionadas em recipientes adequados", "row": 72, "group": false}, {"code": "3.3.11", "text": "As lâmpadas fluorescentes queimadas e inservíveis estão separadas e acondicionadas em recipientes adequados", "row": 73, "group": false}, {"code": "3.3.12", "text": "As bombonas e recipientes usados para acondicionamento dos resíduos são resistentes a vazamento", "row": 74, "group": false}, {"code": "3.3.13", "text": "As bombonas e recipientes usados para acondicionamento dos resíduos estão identificados com o resíduo ou tipo ali contido", "row": 75, "group": false}, {"code": "3.3.14", "text": "As bombonas e recipientes de produtos químicos vazios, com restos inservíveis ou com resíduos contaminados são armazenadas na baia de resíduos perigosos", "row": 76, "group": false}, {"code": "3.4", "text": "Resíduos de saúde", "row <script>
"use strict";
const D = window.TPL_DATA;
const SECTIONS = D.sections, SLOTS = D.slots;
const CSLOTS = SLOTS.filter(s=>!s.nc), NCSLOTS = SLOTS.filter(s=>s.nc);
const MAX_NC = NCSLOTS.length;
const ITEMS = []; SECTIONS.forEach(s=>s.items.forEach(it=>{ if(!it.group) ITEMS.push(Object.assign({sec:s.num},it)); }));
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const pad=n=>String(n).padStart(2,'0');
const fmtDT=ts=>{const d=new Date(ts);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const fmtDate=iso=>{ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const mesDe=iso=>{ if(!iso) return ''; const [y,m]=iso.split('-'); return `${MESES[+m-1]}/${y}`; };

/* ================= IndexedDB ================= */
let dbp=null;
function db(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ const r=indexedDB.open('inspecao-canteiro',1);
  r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('insp',{keyPath:'id'}); d.createObjectStore('photos',{keyPath:'id'}); d.createObjectStore('kv'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbp; }
async function tx(store,mode,fn){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode); const s=t.objectStore(store); let out; const r=fn(s); if(r) r.onsuccess=()=>{out=r.result}; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const idb={
  get:(st,k)=>tx(st,'readonly',s=>s.get(k)),
  all:(st)=>tx(st,'readonly',s=>s.getAll()),
  put:(st,v,k)=>tx(st,'readwrite',s=>k===undefined?s.put(v):s.put(v,k)),
  del:(st,k)=>tx(st,'readwrite',s=>s.delete(k)),
};
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ================= State ================= */
let cur=null;           // current inspection
let tab='check';
let openSec=null;
let settings={stamp:true,legCoord:'utm'};
const urlCache={};
async function photoURL(id){ if(!id) return ''; if(urlCache[id]) return urlCache[id]; const p=await idb.get('photos',id); if(!p) return ''; return urlCache[id]=URL.createObjectURL(p.blob); }
let saveT=null;
function save(){ if(!cur) return; cur.updated=Date.now(); clearTimeout(saveT); saveT=setTimeout(()=>idb.put('insp',cur).catch(e=>toast('Erro ao salvar: '+e.message)),250); }
function saveNow(){ clearTimeout(saveT); if(cur){cur.updated=Date.now(); return idb.put('insp',cur);} }
function newInsp(prev){ return {id:uid(),created:Date.now(),updated:Date.now(),
  header:{obra:prev?prev.obra:'',resp:prev?prev.resp:'',data:todayISO()},
  answers:{},obs:{},photos:{},nc:[]}; }

function toast(m,ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function ask(msg,okTxt='Confirmar',danger){ return new Promise(res=>{ const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><p style="margin:4px 0 16px;font-size:16px">${esc(msg)}</p><div class="row"><button class="btn sec" style="flex:1" data-a="0">Cancelar</button><button class="btn ${danger?'red':''}" style="flex:1" data-a="1">${esc(okTxt)}</button></div></div>`;
  m.onclick=e=>{ const a=e.target.dataset.a; if(a!==undefined||e.target===m){ m.remove(); res(a==='1'); } }; document.body.appendChild(m); }); }

/* ================= GPS ================= */
let fix=null, watchId=null, gpsErr='';
function startGPS(){ if(!navigator.geolocation){ gpsErr='Sem GPS'; paintGPS(); return; }
  if(watchId!==null) return;
  watchId=navigator.geolocation.watchPosition(p=>{ fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,alt:p.coords.altitude,t:Date.now()}; gpsErr=''; paintGPS(); },
    e=>{ gpsErr = e.code===1?'GPS negado':'Sem sinal GPS'; paintGPS(); }, {enableHighAccuracy:true,maximumAge:5000,timeout:30000}); }
function paintGPS(){ const g=$('#gps'); if(!g) return; if(fix && Date.now()-fix.t<120000){ g.className='gps ok'; g.textContent='GPS ±'+Math.round(fix.acc)+' m'; } else if(gpsErr){ g.className='gps bad'; g.textContent=gpsErr; } else { g.className='gps'; g.textContent='GPS…'; } }
setInterval(paintGPS,10000);
function getFix(){ return new Promise(res=>{ if(fix && Date.now()-fix.t<60000) return res(fix);
  if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>{ fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}; paintGPS(); res(fix); }, ()=>res(fix||null), {enableHighAccuracy:true,timeout:12000,maximumAge:30000}); }); }

/* UTM (WGS84 ~ SIRGAS 2000) */
function toUTM(lat,lon){ const a=6378137, f=1/298.257223563, k0=0.9996; const e2=f*(2-f), ep2=e2/(1-e2);
  const zone=Math.floor((lon+180)/6)+1; const lon0=((zone-1)*6-180+3)*Math.PI/180; const φ=lat*Math.PI/180, λ=lon*Math.PI/180;
  const N=a/Math.sqrt(1-e2*Math.sin(φ)**2), T=Math.tan(φ)**2, C=ep2*Math.cos(φ)**2, A=Math.cos(φ)*(λ-lon0);
  const M=a*((1-e2/4-3*e2**2/64-5*e2**3/256)*φ-(3*e2/8+3*e2**2/32+45*e2**3/1024)*Math.sin(2*φ)+(15*e2**2/256+45*e2**3/1024)*Math.sin(4*φ)-(35*e2**3/3072)*Math.sin(6*φ));
  let E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let Nn=k0*(M+N*Math.tan(φ)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720)); if(lat<0) Nn+=10000000;
  const bands='CDEFGHJKLMNPQRSTUVWX'; const band=bands[Math.max(0,Math.min(19,Math.floor((lat+80)/8)))];
  return {zone,band,E:Math.round(E),N:Math.round(Nn)}; }
function coordTxt(p,mode){ if(!p||p.lat==null) return 'sem coordenada';
  const u=toUTM(p.lat,p.lon); const utm=`UTM ${u.zone}${u.band} ${u.E.toLocaleString('pt-BR')} E / ${u.N.toLocaleString('pt-BR')} N`;
  const dec=`Lat ${p.lat.toFixed(6)} / Long ${p.lon.toFixed(6)}`;
  return mode==='dec'?dec:mode==='both'?`${utm} (${dec})`:utm; }

/* ================= EXIF (galeria) ================= */
async function readExif(file){ try{ const buf=await file.slice(0,262144).arrayBuffer(); const v=new DataView(buf); if(v.getUint16(0)!==0xFFD8) return null;
  let o=2; while(o<v.byteLength-4){ const m=v.getUint16(o); const len=v.getUint16(o+2); if(m===0xFFE1 && v.getUint32(o+4)===0x45786966){ return parseTiff(v,o+10); } if((m&0xFF00)!==0xFF00) break; o+=2+len; } }catch(e){} return null; }
function parseTiff(v,t){ const le=v.getUint16(t)===0x4949; const u16=o=>v.getUint16(o,le), u32=o=>v.getUint32(o,le);
  const ifd=(o)=>{ const n=u16(o), r={}; for(let i=0;i<n;i++){ const e=o+2+i*12; r[u16(e)]={type:u16(e+2),cnt:u32(e+4),vo:e+8}; } return r; };
  const val=(en)=>{ if(!en) return null; const sz={1:1,2:1,3:2,4:4,5:8,7:1}[en.type]||1; const off=en.cnt*sz>4?t+u32(en.vo):en.vo;
    if(en.type===2){ let s=''; for(let i=0;i<en.cnt-1;i++) s+=String.fromCharCode(v.getUint8(off+i)); return s; }
    if(en.type===5){ const a=[]; for(let i=0;i<en.cnt;i++) a.push(u32(off+i*8)/u32(off+i*8+4)); return a; }
    if(en.type===3) return u16(off); if(en.type===4) return u32(off); return null; };
  const i0=ifd(t+u32(t+4)); const out={};
  if(i0[0x8769]){ const ex=ifd(t+val(i0[0x8769])); const dt=val(ex[0x9003])||val(i0[0x0132]); if(dt){ const m=dt.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/); if(m) out.ts=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime(); } }
  if(i0[0x8825]){ const g=ifd(t+val(i0[0x8825])); const la=val(g[2]), lo=val(g[4]); if(la&&lo){ let lat=la[0]+la[1]/60+la[2]/3600, lon=lo[0]+lo[1]/60+lo[2]/3600; if(val(g[1])==='S') lat=-lat; if(val(g[3])==='W') lon=-lon; out.lat=lat; out.lon=lon; } }
  return out; }

/* ================= Captura de foto ================= */
let pickResolve=null;
['fCam','fGal'].forEach(id=>{ const el=document.getElementById(id); el.addEventListener('change',()=>{ const f=el.files&&el.files[0]; el.value=''; if(pickResolve){ const r=pickResolve; pickResolve=null; r(f?{file:f,src:id==='fCam'?'camera':'galeria',at:Date.now()}:null); } }); });
function pick(src){ return new Promise(res=>{ pickResolve=res; document.getElementById(src==='camera'?'fCam':'fGal').click(); }); }
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{res(i);}; i.onerror=()=>rej(new Error('Imagem inválida')); i.src=u; }); }
async function capture(src){
  const fixP = src==='camera'?getFix():null;
  const r=await pick(src); if(!r) return null;
  busy(true,'Processando foto…');
  try{
    let meta={ts:r.at,lat:null,lon:null,acc:null,src:r.src};
    if(r.src==='galeria'){ const ex=await readExif(r.file); if(ex&&ex.ts) meta.ts=ex.ts; else meta.ts=r.file.lastModified||r.at; if(ex&&ex.lat!=null){ meta.lat=ex.lat; meta.lon=ex.lon; } else { const f=await getFix(); if(f){ meta.lat=f.lat; meta.lon=f.lon; meta.acc=f.acc; meta.gpsNow=true; } } }
    else { const f=await fixP; if(f){ meta.lat=f.lat; meta.lon=f.lon; meta.acc=f.acc; } }
    const img=await loadImg(r.file);
    const MAX=1600; let w=img.naturalWidth,h=img.naturalHeight; const sc=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d'); g.drawImage(img,0,0,w,h); URL.revokeObjectURL(img.src);
    if(settings.stamp) stamp(g,w,h,meta);
    const blob=await new Promise(rs=>cv.toBlob(rs,'image/jpeg',0.82));
    const p=Object.assign({id:uid(),blob,w,h},meta);
    await idb.put('photos',p);
    return p;
  } finally { busy(false); }
}
function stamp(g,w,h,m){
  const fs=Math.max(14,Math.round(Math.min(w,h)/26));
  const lines=[fmtDT(m.ts)+(m.src==='galeria'?' (galeria)':'')];
  if(m.lat!=null){ const u=toUTM(m.lat,m.lon); lines.push(`UTM ${u.zone}${u.band}  ${u.E} E  ${u.N} N`); lines.push(`Lat ${m.lat.toFixed(6)}  Long ${m.lon.toFixed(6)}`+(m.acc?`  ±${Math.round(m.acc)} m`:'')); }
  else lines.push('Sem coordenada GPS');
  if(cur&&cur.header.obra) lines.push(cur.header.obra);
  let fs2=fs; g.font=`600 ${fs2}px -apple-system, Helvetica, Arial, sans-serif`;
  const mw=Math.max(...lines.map(l=>g.measureText(l).width)); if(mw>w*0.9-fs2*1.8){ fs2=Math.floor(fs2*(w*0.9-fs2*1.8)/mw); g.font=`600 ${fs2}px -apple-system, Helvetica, Arial, sans-serif`; }
  return drawStamp(g,w,h,lines,fs2);
}
function drawStamp(g,w,h,lines,fs){
  const lh=fs*1.25, padd=fs*0.6; const bw=Math.max(...lines.map(l=>g.measureText(l).width))+padd*2; const bh=lines.length*lh+padd*1.4;
  g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(w-bw-padd,h-bh-padd,bw,bh);
  g.fillStyle='#fff'; g.textBaseline='top'; lines.forEach((l,i)=>g.fillText(l,w-bw-padd+padd,h-bh-padd+padd*0.7+i*lh));
}
let busyEl=null;
function busy(on,msg){ if(on){ if(!busyEl){ busyEl=document.createElement('div'); busyEl.className='toast'; document.body.appendChild(busyEl);} busyEl.innerHTML='<span class="spin"></span> '+esc(msg||''); } else if(busyEl){ busyEl.remove(); busyEl=null; } }

/* ================= Render ================= */
const app=$('#app');
function setHeader(title,back){ $('#hTitle').textContent=title; $('#hBack').style.display=back?'':'none'; }
$('#hBack').onclick=async()=>{ await saveNow(); cur=null; renderHome(); };
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; tab=b.dataset.tab; window.scrollTo(0,0); renderInsp(); });

function stats(insp){ const r={C:0,NC:0,NA:0,tot:ITEMS.length,bySec:{}}; SECTIONS.forEach(s=>r.bySec[s.num]={C:0,NC:0,NA:0,tot:0});
  ITEMS.forEach(it=>{ const a=insp.answers[it.row]; r.bySec[it.sec].tot++; if(a){ r[a]++; r.bySec[it.sec][a]++; } }); r.done=r.C+r.NC+r.NA; return r; }
function classif(p){ return p>0.9?['EXCELENTE','#15803d','#dcfce7']:p>0.7?['BOM','#1d4ed8','#dbeafe']:p>0.5?['REGULAR','#a16207','#fef9c3']:['RUIM','#b91c1c','#fee2e2']; }

async function renderHome(){
  setHeader('Inspeção Ambiental de Canteiro',false); $('#tabs').style.display='none';
  let list=[]; try{ list=(await idb.all('insp')).sort((a,b)=>b.updated-a.updated);}catch(e){ app.innerHTML=`<div class="card warn">Não foi possível acessar o armazenamento do aparelho (${esc(e.message)}).</div>`; return; }
  app.innerHTML=`
  <div class="card"><h2>Nova inspeção</h2><p class="muted" style="margin:0 0 12px">Checklist FI.BRA.GER-10.01 · Canteiro de Obra (15 seções, ${ITEMS.length} itens). Funciona sem internet; o relatório sai no modelo Excel da empresa.</p>
  <button class="btn block" id="bNew">＋ Iniciar inspeção</button></div>
  <div class="card"><h2>Inspeções salvas neste aparelho</h2>
  ${list.length?list.map(i=>{ const s=stats(i); return `<div class="list-i"><div class="x"><b>${esc(i.header.obra||'(sem nome)')}</b><span class="muted">${fmtDate(i.header.data)} · ${s.done}/${s.tot} itens · ${Object.keys(i.photos).length+i.nc.length} fotos</span></div>
    <button class="btn sm" data-open="${i.id}">Abrir</button><button class="btn sm sec" data-del="${i.id}">🗑</button></div>`;}).join(''):'<p class="muted">Nenhuma inspeção ainda.</p>'}
  </div>
  <p class="muted" style="text-align:center">Os dados ficam só neste iPhone. Gere o Excel ao final de cada inspeção.</p>`;
  $('#bNew').onclick=async()=>{ const last=await idb.get('kv','lastHeader').catch(()=>null); cur=newInsp(last); await saveNow(); tab='dados'; openSec=null; renderInsp(); };
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{ cur=await idb.get('insp',b.dataset.open); tab='check'; openSec=null; renderInsp(); });
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ const i=list.find(x=>x.id===b.dataset.del); if(!await ask(`Excluir a inspeção "${i.header.obra||'(sem nome)'}" e todas as fotos dela?`,'Excluir',true)) return;
    for(const pid of [...Object.values(i.photos).map(p=>p.photoId),...i.nc.map(n=>n.photoId)]) await idb.del('photos',pid).catch(()=>{});
    await idb.del('insp',i.id); renderHome(); });
}

function renderInsp(){
  startGPS();
  setHeader(cur.header.obra||'Nova inspeção',true); $('#tabs').style.display='';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ({dados:renderDados,check:renderCheck,nc:renderNC,resumo:renderResumo})[tab]();
}

function renderDados(){
  const h=cur.header;
  app.innerHTML=`<div class="card"><h2>Identificação</h2>
    <label>Obra e Canteiro</label><input type="text" id="iObra" value="${esc(h.obra)}" placeholder="Ex.: LT 500 kV Juazeiro III – Campo Formoso II / Canteiro Central">
    <label>Responsável pela inspeção</label><input type="text" id="iResp" value="${esc(h.resp)}" placeholder="Nome">
    <label>Data da inspeção</label><input type="date" id="iData" value="${esc(h.data)}">
    <label>Mês (preenchido automaticamente)</label><input type="text" id="iMes" value="${esc(h.mes||mesDe(h.data))}">
    <button class="btn block" style="margin-top:16px" id="bGo">Ir para o checklist →</button></div>
  <div class="card"><h2>Fotos</h2>
    <label class="chk"><input type="checkbox" id="sStamp" ${settings.stamp?'checked':''}> Gravar data, hora e coordenadas na própria foto</label>
    <label>Coordenada na legenda do relatório</label>
    <select id="sLeg"><option value="utm">UTM (SIRGAS 2000)</option><option value="dec">Lat/Long decimal</option><option value="both">UTM + Lat/Long</option><option value="none">Não incluir</option></select>
    <p class="muted">Data e hora sempre entram na legenda. Para o GPS funcionar, permita a localização quando o iPhone pedir.</p></div>`;
  $('#sLeg').value=settings.legCoord;
  const up=()=>{ h.obra=$('#iObra').value.trim(); h.resp=$('#iResp').value.trim(); const od=h.data; h.data=$('#iData').value; if(od!==h.data && (!h.mes||h.mes===mesDe(od))) { h.mes=mesDe(h.data); $('#iMes').value=h.mes; } else h.mes=$('#iMes').value.trim(); setHeader(h.obra||'Nova inspeção',true); save(); idb.put('kv',{obra:h.obra,resp:h.resp},'lastHeader').catch(()=>{}); };
  ['iObra','iResp','iData','iMes'].forEach(i=>$('#'+i).addEventListener('input',up)); $('#iData').addEventListener('change',up);
  $('#sStamp').onchange=e=>{ settings.stamp=e.target.checked; idb.put('kv',settings,'settings'); };
  $('#sLeg').onchange=e=>{ settings.legCoord=e.target.value; idb.put('kv',settings,'settings'); };
  $('#bGo').onclick=()=>{ tab='check'; renderInsp(); };
}

function slotHTML(s,entry,url){
  const leg=entry? (entry.legenda||'') : '';
  return `<div class="slot ${entry?'has':''}" data-slot="${s.id}"><div class="st">${esc(s.title)}</div>
   <div class="im" style="${url?`background-image:url(${url})`:''}">${entry?'':'<button data-cam="'+s.id+'">📷</button><button data-gal="'+s.id+'">🖼️</button>'}</div>
   ${entry?`<div class="lg">${esc(leg||'Toque para legenda')}</div>`:''}</div>`;
}

async function renderCheck(){
  const st=stats(cur);
  let html=`<div class="card" style="padding:12px 14px"><div class="row" style="justify-content:space-between"><b>${st.done} de ${st.tot} itens respondidos</b><span class="muted">${Object.keys(cur.photos).length} fotos · ${cur.nc.length} NC</span></div><div class="bar"><i style="width:${st.done/st.tot*100}%"></i></div></div>`;
  for(const s of SECTIONS){
    const b=st.bySec[s.num]; const done=b.C+b.NC+b.NA; const isOpen=openSec===s.num;
    html+=`<div class="card" id="sec${s.num}"><div class="sec-h" data-sec="${s.num}"><div class="n">${s.num}</div><div class="tt">${esc(s.title)}</div>
      <div class="prog ${done===b.tot?'done':''}">${b.NC?`<span class="pill NC">${b.NC} NC</span> `:''}${done}/${b.tot}</div><div>${isOpen?'▴':'▾'}</div></div>`;
    if(isOpen){
      html+=`<div class="row" style="margin:12px 0 4px"><span class="muted">Marcar pendentes:</span><button class="btn sm sec" data-all="C">Todos C</button><button class="btn sm sec" data-all="NA">Todos NA</button></div>`;
      for(const it of s.items){
        if(it.group){ html+=`<div class="grp">${esc(it.code)} ${esc(it.text)}</div>`; continue; }
        const a=cur.answers[it.row];
        const ncp=cur.nc.filter(n=>n.itemRow===it.row);
        html+=`<div class="item" data-row="${it.row}"><div class="c">${esc(it.code)}</div><div class="d">${esc(it.text)}</div>
          <div class="seg">${['C','NC','NA'].map(k=>`<button class="${k} ${a===k?'on':''}" data-ans="${k}">${k}</button>`).join('')}</div>
          ${a==='NC'?`<div class="ncbox"><span style="flex:1;font-size:13px">${ncp.length?`📎 ${ncp.length} foto(s) de NC`:'Registre a não conformidade:'}</span><button class="btn sm red" data-nccam="${it.row}">📷 Foto NC</button><button class="btn sm sec" data-ncgal="${it.row}">🖼️</button></div>`:''}
        </div>`;
      }
      html+=`<label>Observações da seção ${s.num}</label><textarea data-obs="${s.num}" placeholder="Ex.: ${s.num}.x – não existe esta área no canteiro.">${esc(cur.obs[s.num]||'')}</textarea>`;
      const sl=CSLOTS.filter(x=>x.sec==+s.num);
      if(sl.length){ html+=`<label>Registro fotográfico (itens conformes)</label><div class="photos">`;
        for(const x of sl){ const e=cur.photos[x.id]; html+=slotHTML(x,e,e?await photoURL(e.photoId):''); }
        html+='</div>'; }
      html+=`<button class="btn sec block" style="margin-top:14px" data-close="1">Concluir seção ▴</button>`;
    }
    html+='</div>';
  }
  app.innerHTML=html;
}

app.addEventListener('click',async e=>{
  const t=e.target; if(!cur || tab!=='check' && tab!=='nc') return;
  const sh=t.closest('[data-sec]'); if(sh){ const n=sh.dataset.sec; openSec=openSec===n?null:n; await renderCheck(); if(openSec) document.getElementById('sec'+n).scrollIntoView({block:'start'}); window.scrollBy(0,-60); return; }
  if(t.dataset.close){ const n=openSec; openSec=null; await renderCheck(); const el=document.getElementById('sec'+n); el&&el.scrollIntoView({block:'center'}); return; }
  if(t.dataset.ans){ const row=+t.closest('[data-row]').dataset.row; const k=t.dataset.ans; if(cur.answers[row]===k) delete cur.answers[row]; else cur.answers[row]=k; save(); const y=window.scrollY; await renderCheck(); window.scrollTo(0,y); return; }
  if(t.dataset.all){ const sec=SECTIONS.find(s=>s.num===openSec); sec.items.forEach(it=>{ if(!it.group && !cur.answers[it.row]) cur.answers[it.row]=t.dataset.all; }); save(); const y=window.scrollY; await renderCheck(); window.scrollTo(0,y); return; }
  if(t.dataset.cam||t.dataset.gal){ const id=t.dataset.cam||t.dataset.gal; const p=await capture(t.dataset.cam?'camera':'galeria'); if(!p) return; cur.photos[id]={photoId:p.id,legenda:''}; save(); await rerender(); openPhoto('slot',id); return; }
  if(t.dataset.nccam||t.dataset.ncgal){ if(cur.nc.length>=MAX_NC){ toast(`O modelo comporta ${MAX_NC} fotos de não conformidade.`); return; } const row=+(t.dataset.nccam||t.dataset.ncgal); const p=await capture(t.dataset.nccam?'camera':'galeria'); if(!p) return;
    const it=ITEMS.find(i=>i.row===row); cur.nc.push({photoId:p.id,itemRow:row||null,legenda:it?`Item ${it.code} – ${it.text}`:''}); save(); await rerender(); openPhoto('nc',cur.nc.length-1); return; }
  const slot=t.closest('[data-slot]'); if(slot && cur.photos[slot.dataset.slot]){ openPhoto('slot',slot.dataset.slot); return; }
  const ncs=t.closest('[data-ncidx]'); if(ncs){ openPhoto('nc',+ncs.dataset.ncidx); return; }
});
app.addEventListener('input',e=>{ const o=e.target.dataset&&e.target.dataset.obs; if(o!==undefined && cur){ cur.obs[o]=e.target.value; save(); } });
async function rerender(){ const y=window.scrollY; if(tab==='check') await renderCheck(); else if(tab==='nc') await renderNC(); window.scrollTo(0,y); }

async function openPhoto(kind,key){
  const entry= kind==='slot'?cur.photos[key]:cur.nc[key]; if(!entry) return;
  const p=await idb.get('photos',entry.photoId); const url=await photoURL(entry.photoId);
  const title= kind==='slot'? SLOTS.find(s=>s.id===key).title : `Não conformidade ${key+1}`;
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b>${esc(title)}</b><button class="btn sm sec" data-x="close">Fechar</button></div>
    <img src="${url}"><p class="muted" style="margin:8px 0 0">${p?fmtDT(p.ts):''} · ${p?esc(coordTxt(p,'both')):''}${p&&p.acc?` · ±${Math.round(p.acc)} m`:''}${p&&p.gpsNow?' · (coordenada do momento da inclusão)':''}</p>
    <label>Legenda</label><textarea id="mLeg" placeholder="Descreva o que a foto mostra">${esc(entry.legenda||'')}</textarea>
    <p class="muted" style="margin:4px 0 0">No relatório: <i id="mPrev"></i></p>
    <div class="row" style="margin-top:14px"><button class="btn sec" style="flex:1" data-x="redo">📷 Refazer</button><button class="btn red" style="flex:1" data-x="del">Remover</button><button class="btn" style="flex:1" data-x="close">OK</button></div></div>`;
  document.body.appendChild(m);
  const prev=()=>{ $('#mPrev',m).textContent=legendaFinal(entry,p,kind==='slot'?title:''); }; prev();
  $('#mLeg',m).addEventListener('input',ev=>{ entry.legenda=ev.target.value; save(); prev(); });
  m.addEventListener('click',async ev=>{ const x=ev.target.dataset.x; if(ev.target===m) { m.remove(); rerender(); return; } if(!x) return;
    if(x==='close'){ m.remove(); rerender(); }
    if(x==='del'){ if(!await ask('Remover esta foto?','Remover',true)) return; await idb.del('photos',entry.photoId).catch(()=>{}); if(kind==='slot') delete cur.photos[key]; else cur.nc.splice(key,1); save(); m.remove(); rerender(); }
    if(x==='redo'){ const np=await capture('camera'); if(!np) return; await idb.del('photos',entry.photoId).catch(()=>{}); entry.photoId=np.id; save(); m.remove(); await rerender(); openPhoto(kind,key); }
  });
}
function legendaFinal(entry,p,fallback){
  const parts=[(entry.legenda||'').trim()||fallback||''];
  if(p){ parts.push(fmtDT(p.ts)); if(settings.legCoord!=='none') parts.push(coordTxt(p,settings.legCoord)); }
  return parts.filter(Boolean).join(' – ');
}

async function renderNC(){
  const ncItems=ITEMS.filter(it=>cur.answers[it.row]==='NC');
  let html=`<div class="card"><h2>Itens não conformes (${ncItems.length})</h2>${ncItems.length?ncItems.map(it=>`<div class="item"><div class="c">${esc(it.code)} · Seção ${it.sec}</div><div class="d" style="margin:0">${esc(it.text)}</div></div>`).join(''):'<p class="muted">Nenhum item marcado como NC.</p>'}</div>
  <div class="card"><h2>Fotos de não conformidade (${cur.nc.length}/${MAX_NC})</h2><p class="muted" style="margin-top:0">Vão para o bloco "ITENS NÃO CONFORMES" do registro fotográfico.</p><div class="photos">`;
  for(let i=0;i<cur.nc.length;i++){ const n=cur.nc[i]; const u=await photoURL(n.photoId); html+=`<div class="slot has" data-ncidx="${i}"><div class="st">NC ${i+1}</div><div class="im" style="background-image:url(${u})"></div><div class="lg">${esc(n.legenda||'Toque para legenda')}</div></div>`; }
  if(cur.nc.length<MAX_NC) html+=`<div class="slot"><div class="st">Nova foto de NC</div><div class="im"><button data-nccam="0">📷</button><button data-ncgal="0">🖼️</button></div></div>`;
  html+='</div></div>';
  app.innerHTML=html;
}

function renderResumo(){
  const st=stats(cur); const pc=st.C+st.NC?st.C/(st.C+st.NC):0; const [cl,fg,bg]=classif(pc);
  const pend=ITEMS.filter(it=>!cur.answers[it.row]);
  const semFoto=CSLOTS.filter(s=>!cur.photos[s.id]).length;
  app.innerHTML=`<div class="card" style="text-align:center"><div class="muted">Conformidade (C ÷ (C + NC))</div><div class="big">${(pc*100).toFixed(0)}%</div><span class="res" style="background:${bg};color:${fg}">${cl}</span>
    <div class="row" style="justify-content:center;margin-top:10px"><span class="pill C">C ${st.C}</span><span class="pill NC">NC ${st.NC}</span><span class="pill NA">NA ${st.NA}</span></div></div>
  ${pend.length?`<div class="card warn"><b>${pend.length} item(ns) sem resposta.</b> Eles ficam em branco no Excel.<br><span style="font-size:12.5px">${pend.slice(0,12).map(i=>i.code).join(', ')}${pend.length>12?'…':''}</span></div>`:''}
  ${!cur.header.obra||!cur.header.resp?`<div class="card warn">Preencha a obra e o responsável na aba <b>Dados</b>.</div>`:''}
  <div class="card"><button class="btn block" id="bGen">📄 Gerar relatório Excel</button><div id="out" style="margin-top:12px"></div>
   <p class="muted" style="margin-bottom:0">${Object.keys(cur.photos).length} fotos de conformes (${semFoto} quadros vazios) · ${cur.nc.length} fotos de NC</p></div>
  <div class="card"><h2>Resumo por seção</h2><table><tr><th>Seção</th><th class="n">C</th><th class="n">NC</th><th class="n">NA</th></tr>
   ${SECTIONS.map(s=>{const b=st.bySec[s.num];return `<tr><td>${s.num}. ${esc(s.title)}</td><td class="n">${b.C}</td><td class="n" style="${b.NC?'color:#b91c1c;font-weight:700':''}">${b.NC}</td><td class="n">${b.NA}</td></tr>`}).join('')}
   <tr><th>Total</th><th class="n">${st.C}</th><th class="n">${st.NC}</th><th class="n">${st.NA}</th></tr></table></div>`;
  $('#bGen').onclick=async()=>{ const b=$('#bGen'); b.disabled=true; b.innerHTML='<span class="spin"></span> Gerando…';
    try{ const {blob,name}=await buildXlsx(cur); const file=new File([blob],name,{type:blob.type}); const u=URL.createObjectURL(blob);
      const canShare=navigator.canShare&&navigator.canShare({files:[file]});
      $('#out').innerHTML=`<div class="row">${canShare?'<button class="btn" style="flex:1" id="bShare">Compartilhar / Salvar em Arquivos</button>':''}<a class="btn sec" style="flex:1;text-decoration:none" href="${u}" download="${esc(name)}">⬇︎ Baixar</a></div><p class="muted">${esc(name)} · ${(blob.size/1048576).toFixed(1)} MB</p>`;
      if(canShare) $('#bShare').onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{});
    }catch(err){ console.error(err); $('#out').innerHTML=`<div class="warn">Erro ao gerar: ${esc(err.message)}</div>`; }
    b.disabled=false; b.textContent='📄 Gerar relatório Excel novamente'; };
}

/* ================= Geração do Excel ================= */
const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
function b64ToU8(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function colNum(ref){ const m=ref.match(/^([A-Z]+)(\d+)$/); let c=0; for(const ch of m[1]) c=c*26+ch.charCodeAt(0)-64; return [c,+m[2]]; }
function setCell(doc,ref,text){
  const [c,r]=colNum(ref); const sd=doc.getElementsByTagNameNS(NS,'sheetData')[0];
  let row=null; for(const x of sd.children){ const n=+x.getAttribute('r'); if(n===r){row=x;break;} if(n>r){ row=doc.createElementNS(NS,'row'); row.setAttribute('r',r); sd.insertBefore(row,x); break; } }
  if(!row){ row=doc.createElementNS(NS,'row'); row.setAttribute('r',r); sd.appendChild(row); }
  let cell=null; for(const x of row.children){ const cc=colNum(x.getAttribute('r'))[0]; if(cc===c){cell=x;break;} if(cc>c){ cell=doc.createElementNS(NS,'c'); cell.setAttribute('r',ref); row.insertBefore(cell,x); break; } }
  if(!cell){ cell=doc.createElementNS(NS,'c'); cell.setAttribute('r',ref); row.appendChild(cell); }
  while(cell.firstChild) cell.removeChild(cell.firstChild);
  if(text===null||text===''){ cell.removeAttribute('t'); return; }
  cell.setAttribute('t','inlineStr'); const is=doc.createElementNS(NS,'is'), tt=doc.createElementNS(NS,'t');
  tt.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve'); tt.textContent=text; is.appendChild(tt); cell.appendChild(is);
}
function ser(doc){ let s=new XMLSerializer().serializeToString(doc); if(!s.startsWith('<?xml')) s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s; return s; }
function chunk(text,n){ const out=[]; for(const para of String(text).split(/\n/)){ let line=''; for(const w of para.split(/\s+/)){ if(!w) continue; if((line+' '+w).trim().length>n && line){ out.push(line); line=w; } else line=(line?line+' ':'')+w; } out.push(line); } return out.filter((l,i,a)=>l||i<a.length-1); }
const colPx=w=>Math.trunc(((256*w+Math.trunc(128/7))/256)*7);
const EMU_PX=9525, EMU_PT=12700;
function geom(){ const cx=[0]; for(let i=0;i<11;i++) cx.push(cx[i]+colPx(D.colw[i]||8.43)*EMU_PX); const ry=[0]; for(let r=1;r<400;r++) ry.push(ry[r-1]+(D.rowh[r]||14.25)*EMU_PT); return {cx,ry}; }
function locate(arr,v){ let i=0; while(i<arr.length-2 && arr[i+1]<=v) i++; return [i,Math.round(v-arr[i])]; }
async function buildXlsx(insp){
  const zip=await JSZip.loadAsync(b64ToU8(D.tpl));
  const P=new DOMParser();
  // ---- Checklist
  const s1=P.parseFromString(await zip.file('xl/worksheets/sheet1.xml').async('string'),'application/xml');
  const h=insp.header;
  setCell(s1,'C7',h.obra||''); setCell(s1,'C8',h.resp||''); setCell(s1,'C9',h.mes||mesDe(h.data)); setCell(s1,'C10',fmtDate(h.data));
  ITEMS.forEach(it=>{ const a=insp.answers[it.row]; if(a) setCell(s1,({C:'H',NC:'I',NA:'J'})[a]+it.row,'X'); });
  SECTIONS.forEach(s=>{ const txt=(insp.obs[s.num]||'').trim(); if(!txt) return; const rows=[s.obsLabel,...s.obsRows]; let L=chunk(txt,105);
    if(L.length>rows.length) L=[...L.slice(0,rows.length-1),L.slice(rows.length-1).join(' ')];
    L.forEach((l,i)=>setCell(s1,'A'+rows[i],(i===0?'Observações: ':'')+l)); });
  zip.file('xl/worksheets/sheet1.xml',ser(s1));
  // ---- Registro fotográfico
  const s2=P.parseFromString(await zip.file('xl/worksheets/sheet2.xml').async('string'),'application/xml');
  let drawing=await zip.file('xl/drawings/drawing2.xml').async('string');
  let rels=await zip.file('xl/drawings/_rels/drawing2.xml.rels').async('string');
  const {cx,ry}=geom(); let n=0; let anchors='';
  const place=async(slot,entry,fallback)=>{
    const p=await idb.get('photos',entry.photoId); if(!p) return; n++;
    const name=`foto${n}.jpeg`; zip.file('xl/media/'+name,p.blob); const rid='rIdF'+n;
    rels=rels.replace('</Relationships>',`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${name}"/></Relationships>`);
    const m=4*EMU_PX; const x0=cx[slot.c0]+m, x1=cx[slot.c1+1]-m, y0=ry[slot.r0-1]+m, y1=ry[slot.r1]-m;
    const bw=x1-x0, bh=y1-y0; const sc=Math.min(bw/p.w,bh/p.h); const w=Math.round(p.w*sc), hh=Math.round(p.h*sc);
    const ax=x0+(bw-w)/2, ay=y0+(bh-hh)/2; const [fc,fco]=locate(cx,ax),[fr,fro]=locate(ry,ay),[tc,tco]=locate(cx,ax+w),[tr,tro]=locate(ry,ay+hh);
    anchors+=`<xdr:twoCellAnchor editAs="oneCell"><xdr:from><xdr:col>${fc}</xdr:col><xdr:colOff>${fco}</xdr:colOff><xdr:row>${fr}</xdr:row><xdr:rowOff>${fro}</xdr:rowOff></xdr:from><xdr:to><xdr:col>${tc}</xdr:col><xdr:colOff>${tco}</xdr:colOff><xdr:row>${tr}</xdr:row><xdr:rowOff>${tro}</xdr:rowOff></xdr:to><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${100+n}" name="Foto ${n}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="${Math.round(ax)}" y="${Math.round(ay)}"/><a:ext cx="${w}" cy="${hh}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:twoCellAnchor>`;
    setCell(s2,slot.leg,legendaFinal(entry,p,fallback));
    if(slot.blankTitle) setCell(s2,slot.cell,slot.title);
  };
  for(const s of CSLOTS){ const e=insp.photos[s.id]; if(e) await place(s,e,s.title); }
  for(let i=0;i<insp.nc.length && i<NCSLOTS.length;i++) await place(NCSLOTS[i],insp.nc[i],'Não conformidade');
  drawing=drawing.replace('</xdr:wsDr>',anchors+'</xdr:wsDr>');
  zip.file('xl/drawings/drawing2.xml',drawing); zip.file('xl/drawings/_rels/drawing2.xml.rels',rels); zip.file('xl/worksheets/sheet2.xml',ser(s2));
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const safe=(h.obra||'Canteiro').replace(/[\\/:*?"<>|]+/g,'-').slice(0,60).trim();
  const [y,mo,d]=(h.data||todayISO()).split('-');
  return {blob,name:`FI.BRA.GER-10.01 Checklist Inspeção Ambiental - ${safe} - ${d}-${mo}-${y}.xlsx`};
}
window.__buildXlsx=buildXlsx; window.__idb=idb;

/* ================= Boot ================= */
(async()=>{ try{ const s=await idb.get('kv','settings'); if(s) settings=Object.assign(settings,s); }catch(e){} renderHome(); })();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
